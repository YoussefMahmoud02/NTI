<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="Bootstrap/CSS/Bootstrap.css">
    <link rel="stylesheet" href="Css/all.css">
    <link rel="stylesheet" href="Css/Style.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark p-2 ">
        <div class="container-fluid logo ">

            <a class="navbar-brand" href="#">Envato Market</a>
            <button class="btn btn-success text-light " type="submit">Buy More</button>

        </div>
    </nav>

    <section class="container-fluid">
        <div class="row">

            <div class="sign_in col-7 p-5 d-flex flex-column justify-content-around align-items-center ">
                <div class="w-75">

                    <img src="Images/aiqrlink-logo.svg" alt="">

                    <div class="title">
                        <p style="color: #ffb08f ; letter-spacing: 1px;">WELCOME BACK</p>
                        <h1>Sign in to your workspace</h1>
                        <p style="color: #45556c; ">Continue building beautiful QR codes and short links.</p>
                    </div>

                    <div class="type mb-3">
                        <div class="head d-flex align-items-center justify-content-between " style="color: #62748e ;">
                            <p>Explore the demo</p>
                            <p style="font-size: 0.8rem;">Auto-fill access</p>
                        </div>

                        <div class="choice row d-flex justify-content-between align-items-center ">
                            <div class="btn position-relative col-6 ms-0 ps-0 " >
                                <button
                                    class="card d-flex flex-column justify-content-start align-items-start p-3 rounded-3 ms-0 ">

                                    <span class="icon p-2 rounded-3 text-light fw-bold mb-2 "
                                        style=" background-color: #f56f3b;">
                                        SA
                                    </span>

                                    <h5>Login as Super Admin</h5>

                                    <p>Manage the whole platform and demo settings.</p>

                                    <h6>Fill credentials <i class="fa-solid fa-arrow-right"></i></h6>

                                </button>
                            </div>

                            <div class="btn position-relative col-6 me-0 pe-0   d-flex justify-content-end" >
                                <button
                                    class="card d-flex flex-column justify-content-start align-items-start p-3 rounded-3 me-0 ">
                                    <span class="icon p-2 rounded-3 text-light fw-bold mb-2 "
                                        style="background-color: #0f172b;">
                                        TU
                                    </span>

                                    <h5>Login as Tenant</h5>

                                    <p>Explore the workspace and tenant tools.</p>

                                    <h6>Fill credentials <i class="fa-solid fa-arrow-right"></i></h6>

                                </button>
                            </div>
                        </div>
                    </div>

                    <form method="get" class="w-100 m-0 p-0 d-flex flex-column justify-content-between align-items-start" >

                        <label for="email" class="w-100 p-0 my-1" >
                            <span>E mail</span>
                        </label>
                        <input type="email" id="email" placeholder="you@workspace.com" required
                                class="w-100 p-2 border-2 border-secondary rounded-2 my-1"
                                style="border: solid;">

                        <label for="password" class="w-100 p-0 my-1 d-flex justify-content-between " >
                            <span>Password</span>
                            <span>Forget?</span>
                        </label>
                        <input type="password" id="password" placeholder="********" required 
                                class="w-100 p-2 border-2 border-secondary rounded-2 my-1"
                                style="border: solid;">

                        <button class="w-100 p-2 border-0  rounded-2 my-3 text-light fw-semibold" style="background-color: #0f172b ;" >
                            Sign in <i class="fa-solid fa-arrow-right"></i> </button>

                    </form>

                </div>
            </div>

            <div class="details col-5 d-flex justify-content-center align-items-center flex-column text-light">

                <div class="content w-50 ">
                   
                    <p style="color: #ffb08f ; letter-spacing: 1px;">CASE STUDY</p>

                    <h3>
                        "aiQRlink replaced three tools and tripled our offline campaign attribution overnight."
                    </h3>

                    <div class="person d-flex flex-row align-items-start justify-content-center mt-5">

                        <div class="icon rounded-circle mx-3 " style="width: 50px; height: 50px;">
                            <img src="Images/icon.svg" class="img-fluid">
                        </div>

                        <div class="info d-flex align-items-start justify-content-center flex-column ">
                            <h5 class="my-0">Sarah Chen</h5>
                            <p style="color: #90a1b9 ; ">Head of Growth, Sample Company</p>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </section>

    <script src="Bootstrap/JS/Bootstrap.js"></script>
</body>

</html>
